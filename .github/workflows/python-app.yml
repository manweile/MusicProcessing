# @file python-app.yml
# @author Gerald Manweiler
#
# @brief GitHub Actions workflow for building and testing the MusicProcessing project with Python and FFmpeg.
#
# @details This workflow sets up the Python environment, caches FFmpeg and pip dependencies, installs FFmpeg, installs required
# Linux system libraries for wxPython builds, installs Python dependencies, and runs unit tests.<br>
# for more information, see: https://github.com
#
# @note Refer to Environment.md for Github Local Actions section for important setup instructions.
#
# @version 1.1.0
# @date 2026-11-22
#
# @copyright Copyright (c) 2026 Gerald Manweiler

name: Unit Tests

# designed for calling by other workflows, such as the main CI pipeline, is not intended for triggering directly by events
on:
  workflow_call:

# using specific version of ffmpeg because empirically proven to work
# ffmpeg update has produced "gotcha" issues in the past (8.0.1 to 8.1 in re ffprobe media info handling)
# the wxPython wheel is for CPython 3.14 on Linux x86_64 (Ubuntu 26.04), so it’s suitable for the workflow’s runner
# any updates to either Ubuntu runner or Python version may require adjustments to the specified wheel
env:
  FFMPEG_HOST: "github.com"
  FFMPEG_REPO: "BtbN/FFmpeg-Builds"
  FFMPEG_RELEASE_TAG: "latest"
  FFMPEG_ARCHIVE: "ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
  WX_PYTHON_WHEEL_FILE: "wxpython-4.3.2+ubuntu2604-cp314-cp314-linux_x86_64.whl"
  WX_PYTHON_WHEEL_URL: "https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.3.2/wxpython-4.3.2+ubuntu2604-cp314-cp314-linux_x86_64.whl"

jobs:
  run-unit-tests:
    name: Unit Tests
    # must match the image specified in .actrc file for GitHub Local Actions runner
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      # need to detect if running in act (local GitHub Actions runner) to conditionally skip certain steps
      - name: Detect act
        id: detect-act
        run: echo "is-act=${ACT:-false}" >> "$GITHUB_OUTPUT"

      # ensure node stays on the default system PATH after setup-python modifies GITHUB_PATH
      - name: Ensure node is in /usr/local/bin for act
        if: steps.detect-act.outputs.is-act == 'true'
        run: |
          node_path=$(command -v node || true)
          if [ -n "$node_path" ] && [ "$node_path" != "/usr/local/bin/node" ]; then
            sudo ln -sf "$node_path" /usr/local/bin/node
          fi

      # checkout the repository to ensure the workflow has access to the codebase
      - name: Checkout Repository
        # skip checkout when running in act; the local workspace is already mounted,
        # and running checkout will overwrite uncommitted changes or fail on unpushed commits
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      # the python environment is set up with the required version and dependencies for running the unit tests
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # cache FFmpeg download to speed up subsequent workflow runs
      - name: Cache FFmpeg Download
        # only cache FFmpeg download if not running in act
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: .cache/ffmpeg/${{ env.FFMPEG_ARCHIVE }}
          key: ${{ runner.os }}-ffmpeg-${{ env.FFMPEG_RELEASE_TAG }}

      # download FFmpeg if necessary and cache
      - name: Download FFmpeg
        # download on a cache miss in GitHub or when the local act archive is invalid
        if: >
          (steps.detect-act.outputs.is-act == 'false' && steps.cache-ffmpeg.outputs.cache-hit != 'true') ||
          steps.detect-act.outputs.is-act == 'true'
        run: |
          if [ "${ACT:-false}" = "true" ] && [ -f ".cache/ffmpeg/${FFMPEG_ARCHIVE}" ]; then
            if xz -t ".cache/ffmpeg/${FFMPEG_ARCHIVE}"; then
              echo "FFmpeg archive already downloaded and valid, skipping."
              exit 0
            fi
            echo "Cached FFmpeg archive is invalid; downloading a fresh copy."
            rm -f ".cache/ffmpeg/${FFMPEG_ARCHIVE}"
          fi

          FFMPEG_URL="https://${FFMPEG_HOST}/${FFMPEG_REPO}/releases/download/${FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE}"
          echo "Downloading ${FFMPEG_URL}"
          mkdir -p .cache/ffmpeg
          if ! curl -fsSL --retry 5 --retry-delay 2 "${FFMPEG_URL}" -o ".cache/ffmpeg/${FFMPEG_ARCHIVE}" || ! xz -t ".cache/ffmpeg/${FFMPEG_ARCHIVE}"; then
            rm -f ".cache/ffmpeg/${FFMPEG_ARCHIVE}"
            echo "Error: Failed to download a valid FFmpeg archive from ${FFMPEG_URL}"
            exit 1
          fi

      # install FFmpeg
      - name: Extract and Install FFmpeg
        # reinstall in act only when the selected archive changes
        run: |
          if [ "${ACT:-false}" = "true" ] &&
            [ -f /opt/ffmpeg/.installed-archive ] &&
            [ "$(cat /opt/ffmpeg/.installed-archive)" = "${FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE}" ] &&
            command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg ${FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE} already installed, skipping."
            exit 0
          fi
          echo "Extracting ${FFMPEG_ARCHIVE}"
          sudo mkdir -p /opt/ffmpeg/extracted
          sudo tar --strip-components 1 -xf ".cache/ffmpeg/${FFMPEG_ARCHIVE}" -C /opt/ffmpeg/extracted
          sudo install -m 755 /opt/ffmpeg/extracted/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 755 /opt/ffmpeg/extracted/bin/ffprobe /usr/local/bin/ffprobe
          echo "${FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE}" | sudo tee /opt/ffmpeg/.installed-archive >/dev/null
          ffmpeg -version
          ffprobe -version

      # install Linux system dependencies needed to build wxPython on Ubuntu runners
      - name: Install wxPython system dependencies
        # only install wxPython system dependencies if not running in act or if xvfb-run is not already installed
        # use --no-install-recommends to avoid installing unnecessary packages and ONLY gets the specified packages & dependencies
        run: |
          if [ "${ACT:-false}" = "true" ] && command -v xvfb-run >/dev/null 2>&1; then
            echo "System dependencies already installed, skipping."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libnotify-dev \
            libsm-dev \
            libsdl2-2.0-0 \
            libcurl4-openssl-dev \
            freeglut3-dev \
            pkg-config \
            xvfb \
            xauth

      # cache required pip modules to speed up subsequent workflow runs
      - name: Cache pip modules
        # only cache pip modules if not running in act; local runs persist via Docker volume mount
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      #  cache the wxPython wheel to avoid rebuilding it from source on subsequent runs
      - name: Cache wxPython wheel
        id: cache-wxpython
        # only cache wxPython wheel if not running in act
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/cache@v4
        with:
          path: .cache/wxpython/${{ env.WX_PYTHON_WHEEL_FILE }}
          key: ${{ runner.os }}-${{ runner.arch }}-wxpython-${{ env.WX_PYTHON_WHEEL_FILE }}

      # download the wxPython wheel if necessary
      - name: Download wxPython
        # download on a cache miss or when running in act
        if: >
          (steps.detect-act.outputs.is-act == 'false' && steps.cache-wxpython.outputs.cache-hit != 'true') ||
          steps.detect-act.outputs.is-act == 'true'
        run: |
          wheel_path=".cache/wxpython/$WX_PYTHON_WHEEL_FILE"

          if [ "${ACT:-false}" = "true" ] && [ -f "$wheel_path" ]; then
            if python -m zipfile -t "$wheel_path" >/dev/null; then
              echo "wxPython wheel already downloaded and valid, skipping."
              exit 0
            fi
            echo "Cached wxPython wheel is invalid; downloading a fresh copy."
            rm -f "$wheel_path"
          fi

          mkdir -p .cache/wxpython
          if ! curl -fsSL --retry 5 --retry-delay 2 "$WX_PYTHON_WHEEL_URL" -o "$wheel_path" || ! python -m zipfile -t "$wheel_path" >/dev/null; then
            rm -f "$wheel_path"
            echo "Error: Failed to download a valid wxPython wheel from $WX_PYTHON_WHEEL_URL"
            exit 1
          fi

      # install Python dependencies, with wxPython wheel downloaded from GitHub so it doesn't have to be built from source
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".cache/wxpython/$WX_PYTHON_WHEEL_FILE"
          pip install -r requirements.txt

      # 1: pythontracemalloc to track memory allocations during non-Github Local Actions runs; helps identify memory leaks and optimize memory usage
      # 2: for Github Local Actions runs, set up generated files path to store generated files in shared memory;
      # coupled to pertinent test suites to ensure isolation and prevent interference with other tests
      # 3:particular unittest test suite files now coupled to pattern; any change to them requires updating the patterns here accordingly

      # non-GUI test suites run first to prevent any interference with GUI tests
      - name: Test model and unit suites
        env:
          PYTHONTRACEMALLOC: ${{ steps.detect-act.outputs.is-act == 'false' && '1' || '0' }}
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            export MUSICPROCESSING_GENERATED_PATH=/dev/shm/generated_files
            rm -rf "$MUSICPROCESSING_GENERATED_PATH"
            mkdir -p "$MUSICPROCESSING_GENERATED_PATH"
          fi

          for pattern in \
            'test_cli_*.py' \
            'test_controllers_*.py' \
            'test_core_*.py' \
            'test_models_*.py' \
            'test_project_main.py' \
            'test_support_*.py'
          do
            xvfb-run -a python -m unittest discover -v -s tests -p "$pattern"
          done

      - name: Test GUI functional suite
        env:
          PYTHONTRACEMALLOC: ${{ steps.detect-act.outputs.is-act == 'false' && '1' || '0' }}
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            export MUSICPROCESSING_GENERATED_PATH=/dev/shm/generated_files
            rm -rf "$MUSICPROCESSING_GENERATED_PATH"
            mkdir -p "$MUSICPROCESSING_GENERATED_PATH"
          fi

          for pattern in \
            'test_gui_*.py'
          do
            xvfb-run -a python -m unittest discover -v -s tests -p "$pattern"
          done
