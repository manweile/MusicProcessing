# @file python-app.yml
# @author Gerald Manweiler
#
# @brief GitHub Actions workflow for building and testing the MusicProcessing project with Python and FFmpeg.
#
# @details This workflow sets up the Python environment, caches FFmpeg and pip dependencies, installs FFmpeg, installs required
# Linux system libraries for wxPython builds, installs Python dependencies, and runs unit tests.<br>
# for more information, see: https://github.com
#
# @version 1.1.0
# @date 2026-10-27
#
# @copyright Copyright (c) 2026 Gerald Manweiler

name: Unit Tests

# designed for calling by other workflows, such as the main CI pipeline, is not intended for triggering directly by events
on:
  workflow_call:

# using specific version of ffmpeg because empirically proven to work
env:
  FFMPEG_RELEASE_TAG: "autobuild-2026-07-31-14-10"
  FFMPEG_ARCHIVE: "ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz"

jobs:
  run-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # need to detect if running in act (local GitHub Actions runner) to conditionally skip certain steps
      - name: Detect act
        id: detect-act
        run: echo "is-act=${ACT:-false}" >> "$GITHUB_OUTPUT"

      # checkout the repository to ensure the workflow has access to the codebase
      - name: Checkout Repository
        # skip checkout when running in act; the local workspace is already mounted,
        # and running checkout will overwrite uncommitted changes or fail on unpushed commits
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      # the python environment is set up with the required version and dependencies for running the unit tests
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cache FFmpeg download to speed up subsequent workflow runs
      - name: Cache FFmpeg Download
        # only cache FFmpeg download if not running in act
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: .cache/ffmpeg/${{ env.FFMPEG_ARCHIVE }}
          key: ${{ runner.os }}-ffmpeg-${{ env.FFMPEG_RELEASE_TAG }}

      # download FFmpeg if necessary and cache
      - name: Download FFmpeg
        # download if not in cache on GitHub, or if archive is missing locally in act
        if: >
          (steps.detect-act.outputs.is-act == 'false' && steps.cache-ffmpeg.outputs.cache-hit == 'false') ||
          (steps.detect-act.outputs.is-act == 'true' && hashFiles(format('.cache/ffmpeg/{0}', env.FFMPEG_ARCHIVE)) == '')
        run: |
          echo "Downloading ${FFMPEG_ARCHIVE}"
          mkdir -p .cache/ffmpeg
          wget --quiet --show-progress --tries=5 --waitretry=2 \
            "https://github.com{FFMPEG_RELEASE_TAG}/${FFMPEG_ARCHIVE}" \
            -O ".cache/ffmpeg/${FFMPEG_ARCHIVE}"

      # install FFmpeg
      - name: Extract and Install FFmpeg
        # only extract and install FFmpeg if not running in act or if FFmpeg is not already installed
        run: |
          if [ "${ACT:-false}" = "true" ] && command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg already installed, skipping."
            exit 0
          fi
          echo "Extracting ${FFMPEG_ARCHIVE}"
          sudo mkdir -p /opt/ffmpeg/extracted
          sudo tar --strip-components 1 -xf ".cache/ffmpeg/${FFMPEG_ARCHIVE}" -C /opt/ffmpeg/extracted
          sudo install -m 755 /opt/ffmpeg/extracted/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo install -m 755 /opt/ffmpeg/extracted/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version
          ffprobe -version

      # install Linux system dependencies needed to build wxPython on Ubuntu runners
      - name: Install wxPython system dependencies
        # only install wxPython system dependencies if not running in act or if xvfb-run is not already installed
        # use --no-install-recommends to avoid installing unnecessary packages and ONLY gets the specified packages & dependencies
        run: |
          if [ "${ACT:-false}" = "true" ] && command -v xvfb-run >/dev/null 2>&1; then
            echo "System dependencies already installed, skipping."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libglib2.0-dev \
            libnotify-dev \
            libsm-dev \
            libsdl2-2.0-0 \
            libcurl4-openssl-dev \
            freeglut3-dev \
            pkg-config \
            xvfb \
            xauth

      # cache required pip modules to speed up subsequent workflow runs
      - name: Cache pip modules
        # only cache pip modules if not running in act; local runs persist via Docker volume mount
        if: steps.detect-act.outputs.is-act == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      # install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # run tests with unittest
      - name: Test with unittest
        # need PYTHONTRACEMALLOC for memory tracing; enables tracking of memory allocations during tests (disabled in act for speed)
        env:
          PYTHONTRACEMALLOC: ${{ steps.detect-act.outputs.is-act == 'false' && '1' || '0' }}
        # /dev/shm is used for storing generated files in memory during act runs to improve performance
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            rm -rf src/generated_files
            mkdir -p /dev/shm/generated_files
            ln -s /dev/shm/generated_files src/generated_files
          fi
          xvfb-run -a python -m unittest discover -v tests

